<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineLista</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">

   
</head>


    
 <body>

    <header class="header">

        <div class="logo-container">
            <img
                src="assets/imagens/logos/logo-cinelista.png"
                alt="Logo CineLista"
                class="logo"
            >
        </div>

        <nav class="menu">
            <a href="#inicio">Início</a>
            <a href="#cadastro">Cadastrar</a>
            <a href="#minha-lista">Minha Lista</a>
        </nav>

    </header>



    <main class="main-content">

        <!-- ==================================================
        ÁREA PRINCIPAL
        No desktop: Cadastro + Minha Lista lado a lado.
        No mobile: um abaixo do outro.
        ================================================== -->

        <div class="area-principal">


    <section class="cadastro-card" id="cadastro">

        <h1>Adicionar à CineLista</h1>

        <!-- Botões para escolher o tipo de conteúdo -->
         <div class="tipo-conteudo">

        <button
            type="button"
            class="tipo-btn ativo"
            id="btn-filmes"
        >
            Filmes
        </button>

        <button
            type="button"
            class="tipo-btn"
            id="btn-series"
        >
            Séries
        </button>

        </div>

            <form class="formulario" id="formulario-cadastro">
            
            <div class="campo">
                <label for="titulo">Título</label>
                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título"
                    required
                >
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <input
                    type="text"
                    id="genero"
                    placeholder="Ex.: Ficção científica"
                    required
                >
            </div>

            <!-- Área que será alterada pelo JavaScript -->
            <div id="campos-duracao">

            <!-- Campo exibido inicialmente para filmes -->
            <div class="campo">
            <label for="duracao">Duração</label>

            <input
                type="number"
                id="duracao"
                min="1"
                placeholder="Ex.: 120 minutos"
                required
            >
        </div>

</div>

            <!-- ==================================================
     STREAMING
     Lista padronizada de plataformas disponíveis
=================================================== -->

<div class="campo">

    <label for="streaming">
        Streaming disponível
    </label>

    <select
        id="streaming"
        required
    >

        <!--
            A primeira opção funciona como orientação
            e não pode ser escolhida como valor válido.
        -->
        <option value="" disabled selected>
            Selecione um streaming
        </option>

        <!-- Plataformas padronizadas -->
        <option value="Netflix">Netflix</option>
        <option value="Prime Video">Prime Video</option>
        <option value="Disney+">Disney+</option>
        <option value="HBO Max">HBO Max</option>
        <option value="Apple TV+">Apple TV+</option>
        <option value="Paramount+">Paramount+</option>
        <option value="Globoplay">Globoplay</option>
        <option value="MUBI">MUBI</option>
        <option value="Crunchyroll">Crunchyroll</option>
        <option value="Telecine">Telecine</option>

        <!-- Para casos que ainda não estejam previstos -->
        <option value="Outro">Outro</option>

    </select>

</div>

            <div class="campo">
                <label for="lancamento">Data de lançamento</label>
                <input
                    type="date"
                    id="lancamento"
                    required
                >
            </div>

            <div class="campo">
                <label for="diretor">Diretor</label>
                <input
                    type="text"
                    id="diretor"
                    placeholder="Digite o nome do diretor"
                    required
                >
            </div>

            <button type="submit" class="btn-salvar">
                Salvar
            </button>

        </form>

        </section>

 <!-- Conteúdo principal da página -->


    <!-- Card de cadastro -->
    <section class="cadastro-card" id="cadastro">

        <!-- Todo o formulário fica aqui dentro -->




    <!-- Minha Lista precisa estar AQUI,
         ainda dentro do mesmo <main> -->
    <section class="minha-lista" id="minha-lista">

        <h2>Minha Lista</h2>

        <!-- ==================================================
        BUSCA POR TÍTULO
        =================================================== -->

        <div class="busca-lista">

        <input
            type="search"
            id="busca-titulo"
            placeholder="Buscar na sua lista..."
            aria-label="Buscar filme ou série pelo título"
        >

        </div>

        <!-- ==================================================
        FILTROS DA MINHA LISTA
        =================================================== -->

        <!-- ==================================================
     FILTROS DA MINHA LISTA
=================================================== -->

<div class="filtros-lista">

    <!-- Mostra filmes e séries -->
    <button
        type="button"
        class="filtro-btn ativo"
        id="filtro-todos"
    >
        Todos

        <!-- Quantidade total de conteúdos -->
        <span
            class="contador-filtro"
            id="contador-todos"
        >
            0
        </span>
    </button>


    <!-- Mostra somente filmes -->
    <button
        type="button"
        class="filtro-btn"
        id="filtro-filmes"
    >
        Filmes

        <!-- Quantidade de filmes cadastrados -->
        <span
            class="contador-filtro"
            id="contador-filmes"
        >
            0
        </span>
    </button>


    <!-- Mostra somente séries -->
    <button
        type="button"
        class="filtro-btn"
        id="filtro-series"
    >
        Séries

        <!-- Quantidade de séries cadastradas -->
        <span
            class="contador-filtro"
            id="contador-series"
        >
            0
        </span>
    </button>

</div>



        <div class="lista-conteudos" id="lista-conteudos">

            <p class="lista-vazia">
                Nenhum filme ou série cadastrado ainda.
            </p>

        </div>

    </section>

    <!-- Fecha a área que reúne Cadastro + Minha Lista -->
    </div>

    </main>







    <!-- Arquivo responsável pelo comportamento da aplicação -->
    <script src="assets/js/script.js"></script>
</body>

</html>
